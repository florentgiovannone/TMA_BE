<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register interest | Museum Association Conference</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}?v=2" sizes="192x192" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}?v=2" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f4f0e8;
        color: #0e2347;
        font-family: "Outfit", "Avenir Next", Avenir, Helvetica, sans-serif;
      }
      .tma-brand-bar {
        display: flex;
        align-items: center;
        padding: 18px 28px;
        background: #fbf9f6;
      }
      .tma-brand-word {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #0e2347;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-decoration: none;
      }
      .tma-brand-word span,
      .tma-brand-mark {
        color: #b08958;
      }
      .tma-brand-mark {
        width: 28px;
        height: 28px;
        flex: none;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }
      .confirm-card {
        background: #fbf9f6;
        border-top: 3px solid #b08958;
        padding: 28px 28px 26px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #b08958;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: normal;
        line-height: 1.2;
        color: #0e2347;
      }
      .lede {
        margin: 0 0 22px;
        font-size: 16px;
        line-height: 1.5;
        color: #243044;
      }
      .cta {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: #0e2347;
        color: #f4f0e8;
        font-size: 15px;
        text-decoration: none;
      }
      .cta:hover {
        background: #16315f;
      }
    </style>
  </head>
  <body>
    <header class="tma-brand-bar">
      <a class="tma-brand-word" href="https://takemearound.com/">
        <svg class="tma-brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.4" />
          <circle cx="16" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path d="M16 3v4M16 25v4M3 16h4M25 16h4" fill="none" stroke="currentColor" stroke-width="1.4" />
        </svg>
        TAKE <span>ME</span> AROUND
      </a>
    </header>
    <main>
      <div class="confirm-card">
        <p class="eyebrow">Museum Association Conference</p>
        <h1>{{ message }}</h1>
        <p class="lede">Thank you for visiting Take Me Around at the Museum Association Conference.</p>
        <a class="cta" href="https://takemearound.com/">Discover more at takemearound.com</a>
      </div>
    </main>
  </body>
</html>
