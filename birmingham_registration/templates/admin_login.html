<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration admin</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}?v=2" sizes="192x192" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}?v=2" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v=10" />
  </head>
  <body>
    <header class="band">
      <div class="band-inner">
        {% include "_mark.html" %}
      </div>
    </header>
    <main class="login">
      <p class="eyebrow">Museum Association Conference</p>
      <h1>Registration admin</h1>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" />
        </label>
        <button class="sign-in" type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
